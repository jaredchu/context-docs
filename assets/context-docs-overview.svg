<text x="118" y="78" font-size="28" font-weight="650" letter-spacing="-.8">Context Docs</text>
<text x="1528" y="76" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="1.2" fill="#5c6673">PROJECT CONTINUITY / PLAIN MARKDOWN</text>
<text x="72" y="204" font-size="58" font-weight="650" letter-spacing="-1.2">A useful handoff, in a file.</text>
<text x="72" y="253" font-size="25" fill="#5c6673">Keep decisions, current work and next steps where the project lives.</text>

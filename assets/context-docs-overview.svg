<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" letter-spacing="1" fill="#5c6673"><text x="100" y="360">01 / WORK</text><text x="618" y="360" fill="#2563eb">02 / SAVE CONTEXT</text><text x="1136" y="360">03 / CONTINUE</text></g>

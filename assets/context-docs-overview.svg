<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title description">
<title id="title">Context Docs: a useful handoff, in a file</title>
<desc id="description">An illustrative workflow: do the work, save decisions, current work and next steps in project Markdown, then ask a new session to read it. The agent works during active sessions and its changes need review.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0 6 3.5 0 7" fill="none" stroke="#2563eb" stroke-width="1.2"/></marker></defs>
